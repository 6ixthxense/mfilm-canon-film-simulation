name: Android APK

# M-Film's film OS as an Android app (android/): the same C as the camera's,
# built with the NDK, around the phone's camera. The APK is an artifact of
# every run, and on main also a release (android-latest) to download on a phone.
on:
  push:
    branches: ["main", "android"]
    paths: ["android/**", "ml-dev/filmos/**", "ml-dev/films/**", "VERSION", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: The card's data (fonts, films, colour tables)
        run: |
          python -m pip install -q numpy scipy pillow
          bash android/scripts/build_assets.sh

      - name: C smoke test
        run: |
          gcc -c -std=gnu99 -O2 -DFOS_DEV_RAWIN -DMFILM_VERSION=\"ci\" \
            -Dfos_port_model=sim_port_model -Iml-dev/filmos \
            ml-dev/filmos/sim/port_files.c -o /tmp/port_files.o
          gcc -std=gnu99 -O2 -DFOS_DEV_RAWIN -DMFILM_VERSION=\"ci\" \
            -Wno-unused-parameter -Wno-unused-function -Wno-sign-compare \
            -Wno-unused-variable -Wno-unused-but-set-variable \
            -Iml-dev/filmos \
            android/test/smoke.c \
            android/app/src/main/cpp/mfilm_port.c \
            android/app/src/main/cpp/mkcr2_lib.c \
            /tmp/port_files.o \
            ml-dev/filmos/sim/fonts.c \
            ml-dev/filmos/sim/films.c \
            ml-dev/filmos/fos_gfx.c \
            ml-dev/filmos/fos_film.c \
            ml-dev/filmos/fos_print.c \
            ml-dev/filmos/fos_dev.c \
            ml-dev/filmos/fos_dng.c \
            ml-dev/filmos/fos_lab.c \
            ml-dev/filmos/fos_looks.c \
            ml-dev/filmos/fos_jpeg.c \
            -lpthread -lm -o /tmp/smoke
          mkdir -p /tmp/card/DCIM/100CANON /tmp/out
          /tmp/smoke "$PWD/android/app/src/main/assets" /tmp/card/ /tmp/out l0 s n w100
          test -f /tmp/card/DCIM/100CANON/IMG_0001.CR2

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name it
        id: apk
        run: |
          V=$(tr -d ' \r\n' < VERSION)-android.${{ github.run_number }}
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/M-Film-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: M-Film-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Release (android-latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "M-Film for Android ${{ steps.apk.outputs.version }}" \
            --notes "Built from ${GITHUB_SHA::7}. Download the APK on the phone and install it (allow installing from this source). Every build is signed with the same key (android/app/mfilm-debug.keystore), so a new one installs over the last."
